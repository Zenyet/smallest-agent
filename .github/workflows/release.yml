name: Release

# 打 tag（v*）后自动打包 macOS / Windows / Linux，并创建 GitHub Release 上传全部产物。
# 各平台在各自的 runner 上原生构建（macOS arm64、Windows x64、Linux x64），
# 不需要在本地交叉编译。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm package:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm package:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist-electron/*.AppImage
          if-no-files-found: error

  win:
    runs-on: windows-2022
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm package:win
      - name: Check packaged native dependencies
        run: pnpm check:package dist-electron/win-unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: |
            dist-electron/*-win-x64-Setup.exe
            dist-electron/*-win-x64-Portable.exe
          if-no-files-found: error

  release:
    needs: [mac, linux, win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA-256 checksums and publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          # upload-artifact 保留 dist-electron/ 前缀，merge 后都在 artifacts/dist-electron/ 下
          cd artifacts/dist-electron
          sha256sum *.dmg *.zip *.AppImage *.exe > SHA256SUMS.txt
          echo "=== 产物清单 ==="
          ls -lh
          echo "=== 创建 Release $tag ==="
          gh release create "$tag" \
            --title "Smallest Agent $tag" \
            --generate-notes \
            *.dmg *.zip *.AppImage *.exe SHA256SUMS.txt
