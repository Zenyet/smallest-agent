[package]
name = "smallest-agent-core"
description = "agent 核心逻辑：ReAct 循环、消息协议、工具系统。不含任何 UI 依赖。"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
agent-client-protocol.workspace = true
anyhow.workspace = true
async-trait.workspace = true
futures-util.workspace = true
reqwest.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "process"] }
# 只为了在代理判定里识别 loopback 主机名。reqwest 已经依赖它，不增加编译负担。
url = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "io-util"] }
# 用来在「非 tokio 执行器」上 await CallModel，模拟 gpui 的处境。
# 见 tests/http.rs 里 calls_from_non_tokio_executor 那个用例。
futures-executor = "0.3"
